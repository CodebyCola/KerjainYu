name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d ci_test_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # MinIO can't be declared as a `services:` container because GitHub
      # Actions services don't support custom `command:` — so it's run
      # manually as a background container instead.
      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=ci_minio_user \
            -e MINIO_ROOT_PASSWORD=ci_minio_pass \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"

      - name: Wait for MinIO to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is up"
              exit 0
            fi
            echo "Waiting for MinIO... ($i)"
            sleep 2
          done
          echo "MinIO failed to start in time"
          docker logs minio
          exit 1

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host \
            --entrypoint sh quay.io/minio/mc:RELEASE.2024-08-26T13-52-28Z -c "
            mc alias set local http://localhost:9000 ci_minio_user ci_minio_pass &&
            mc mb --ignore-existing local/${{ secrets.S3_BUCKET }}
          "

      - name: Run migrations
        run: npm run migrate:up
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_test_user:ci_test_pass@localhost:5432/ci_test_db

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_test_user:ci_test_pass@localhost:5432/ci_test_db
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: ci_minio_user
          S3_SECRET_KEY: ci_minio_pass
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: us-east-1
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          FRONTEND_URL: http://localhost:3000
