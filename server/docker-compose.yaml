services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: kerjainyu
      POSTGRES_PASSWORD: kerjainyu123
      POSTGRES_DB: kerjainyu_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kerjainyu -d kerjainyu_db" ]
      interval: 2s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kerjainyu
      POSTGRES_PASSWORD: kerjainyu123
      POSTGRES_DB: kerjainyu_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kerjainyu -d kerjainyu_test_db" ]
      interval: 2s
      retries: 10

  minio:
    image: minio/minio
    container_name: kerjainyu-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  minio_data:
