services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: kerjainyu
      POSTGRES_PASSWORD: kerjainyu123
      POSTGRES_DB: kerjainyu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerjainyu -d kerjainyu_db"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
